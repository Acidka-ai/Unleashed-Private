name: CI

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:

jobs:
  build_linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build docker image
        uses: docker/build-push-action@v5
        with:
          push: false
          context: docker
          tags: qflipper-build:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build application in docker
        run: docker run --rm --privileged -v "$(pwd):/project" qflipper-build:latest /project/build_linux.sh

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: qFlipper-linux-appimage
          path: ./build/qFlipper-x86_64.AppImage
          if-no-files-found: error
          retention-days: 7

  build_mac:
    name: Build macOS DMG
    runs-on: [self-hosted, ARM64, macOS, qFlipper]
    env:
      MAC_OS_KEYCHAIN_NAME: ${{ secrets.MAC_OS_KEYCHAIN_NAME }}
      MAC_OS_KEYCHAIN_PASSWORD: ${{ secrets.MAC_OS_KEYCHAIN_PASSWORD }}
      MAC_OS_SIGNING_KEY_ID: ${{ secrets.MAC_OS_SIGNING_KEY_ID }}
      MAC_OS_SIGNING_TEAM_ID: ${{ secrets.MAC_OS_SIGNING_TEAM_ID }}
      MAC_OS_SIGNING_USERNAME: ${{ secrets.MAC_OS_SIGNING_USERNAME }}
      MAC_OS_SIGNING_PASSWORD: ${{ secrets.MAC_OS_SIGNING_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Build application
        run: ./build_mac.sh

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: qFlipper-macos-dmg
          path: ./build_mac/qFlipper.dmg
          if-no-files-found: error
          retention-days: 7

  build_windows:
    name: Build Windows Portable
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.4.2
          arch: win64_msvc2019_64
          modules: qt5compat qtserialport qtsvg
          cache: true

      - name: Build portable Windows package
        shell: powershell
        run: .\.github\scripts\build_windows_portable.ps1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qFlipper-windows-bundle
          path: |
            .\build-win-gh\qFlipper.exe
            .\build-win-gh\qFlipper-windows-portable.zip
          if-no-files-found: error
          retention-days: 7
