name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_windows:
    name: Build Windows Portable
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.4.2
          arch: win64_msvc2019_64
          modules: qt5compat qtserialport
          cache: true

      - name: Build portable Windows package
        shell: powershell
        run: .\.github\scripts\build_windows_portable.ps1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qFlipper-windows-bundle
          path: |
            .\build-win-gh\qFlipper.exe
            .\build-win-gh\qFlipper-windows-portable.zip
          if-no-files-found: error
          retention-days: 7

  publish_release:
    name: Publish GitHub Release
    needs: [build_windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: qFlipper-windows-bundle
          path: release-assets

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=manual-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-assets/qFlipper.exe
            release-assets/qFlipper-windows-portable.zip
            ./release-assets/stm32wb5x_FUS_fw.bin
